spring.application.name=rural-sala-de-aula

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rural_sala_de_aula}
spring.datasource.username=${DATABASE_USERNAME:sala}
spring.datasource.password=${DATABASE_PASSWORD:sala}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
