services:
  db:
    image: postgres:16-alpine
    container_name: rural-sala-de-aula-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sala}
      POSTGRES_DB: ${POSTGRES_DB:-rural_sala_de_aula}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rural-sala-de-aula-api:
    build:
      context: ./api
    container_name: rural-sala-de-aula-api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rural_sala_de_aula}
      DATABASE_USERNAME: ${POSTGRES_USER:-sala}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sala}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  rural-sala-de-aula-front:
    build:
      context: ./front
    container_name: rural-sala-de-aula-front
    depends_on:
      rural-sala-de-aula-api:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  uploads_data:
