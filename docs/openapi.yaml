            maxLength: 40
    Tarefa:
      allOf:
        - $ref: '#/components/schemas/TarefaRequest'
        - type: object
          required:
            - id
            - disciplinaId
            - status
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            disciplinaId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/TarefaStatus'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
