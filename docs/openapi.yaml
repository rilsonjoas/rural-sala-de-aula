openapi: 3.0.3
info:
  title: Rural Sala de Aula API
  version: 0.1.0
  description: Contrato entre o front-end e a API.
servers:
  - url: http://localhost:8080/api/v1
  - url: /api/v1
security:
  - cookieAuth: []
tags: [{name: System}, {name: Auth}, {name: Turmas}, {name: Atividades}, {name: Entregas}, {name: Avisos}, {name: Gamificacao}, {name: Notificacoes}, {name: Grupos}]
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      summary: Cria a conta e já inicia a sessão (Set-Cookie). O papel de professor ou aluno é contextual por turma.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses:
        '201': {description: Criado, content: {application/json: {schema: {$ref: '#/components/schemas/Usuario'}}}}
        '429': {description: 'Muitas tentativas (limite por IP). Traz o cabeçalho Retry-After, em segundos.', content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Usuario'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {description: 'Muitas falhas para esse e-mail ou IP. Traz o cabeçalho Retry-After, em segundos.', content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204': {description: Sem conteúdo}
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Usuario'}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /turmas:
    get:
      tags: [Turmas]
      operationId: listTurmas
      summary: Retorna turmas em que o usuário leciona ou está inscrito.
      parameters:
        - {name: semestre, in: query, required: false, schema: {type: string, pattern: '^[0-9]{4}\.[12]$'}, description: 'Filtra por semestre, ex. 2026.2'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Turma'}}}}}
    post:
      tags: [Turmas]
      operationId: createTurma
      summary: Cria uma nova turma. O usuário criador passa a ser o professor.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TurmaInput'}}}}
      responses:
        '201': {description: Criada, content: {application/json: {schema: {$ref: '#/components/schemas/Turma'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /turmas/{turmaId}:
    get:
      tags: [Turmas]
      operationId: getTurma
      parameters: [{$ref: '#/components/parameters/TurmaId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Turma'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /turmas/{turmaId}/avisos:
    parameters: [{$ref: '#/components/parameters/TurmaId'}]
    get:
      tags: [Avisos]
      operationId: listAvisos
      summary: Lista avisos postados no mural da turma.
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Aviso'}}}}}
    post:
      tags: [Avisos]
      operationId: createAviso
      summary: Posta um aviso no mural da turma.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [texto], properties: {texto: {type: string}, comentarioPaiId: {type: string, format: uuid, description: 'Comentário que está sendo respondido. Resposta a uma resposta fica sob o comentário original (um nível).'}}}}}}
      responses:
        '201': {description: Criado, content: {application/json: {schema: {$ref: '#/components/schemas/Aviso'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /turmas/{turmaId}/inscricao:
    delete:
      tags: [Turmas]
      operationId: leaveTurma
      summary: O aluno sai da turma. Entregas e notas ficam com a turma. O professor não sai da própria turma (409).
      parameters: [{$ref: '#/components/parameters/TurmaId'}]
      responses:
        '204': {description: Saiu da turma}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /avisos/{avisoId}/comentarios:
    get:
      tags: [Avisos]
      operationId: listComentarios
      summary: Lista os comentários de um aviso da turma.
      parameters: [{name: avisoId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Comentario'}}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Avisos]
      operationId: createComentario
      summary: Comenta em um aviso da turma.
      parameters: [{name: avisoId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [texto], properties: {texto: {type: string}}}}}}
      responses:
        '201': {description: Criado, content: {application/json: {schema: {$ref: '#/components/schemas/Comentario'}}}}
  /inscricoes:
    post:
      tags: [Turmas]
      operationId: enrollTurma
      summary: Inscreve o usuário em uma turma pelo código.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [codigo], properties: {codigo: {type: string}}}}}}
      responses:
        '201': {description: Inscrito, content: {application/json: {schema: {$ref: '#/components/schemas/Turma'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /turmas/{turmaId}/atividades:
    parameters: [{$ref: '#/components/parameters/TurmaId'}]
    get:
      tags: [Atividades]
      operationId: listAtividades
      summary: Atividades de uma turma com filtros.
      parameters:
        - {$ref: '#/components/parameters/FiltroEstado'}
        - {$ref: '#/components/parameters/FiltroTipo'}
        - {$ref: '#/components/parameters/Ordenar'}
        - {$ref: '#/components/parameters/Direcao'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Atividade'}}}}}
    post:
      tags: [Atividades]
      operationId: createAtividade
      summary: Somente PROFESSOR dono da turma.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AtividadeInput'}}}}
      responses:
        '201': {description: Criada, content: {application/json: {schema: {$ref: '#/components/schemas/Atividade'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /atividades:
    get:
      tags: [Atividades]
      operationId: listMinhasAtividades
      summary: Atividades de todas as turmas em que o usuário está inscrito como aluno.
      parameters:
        - {$ref: '#/components/parameters/FiltroEstado'}
        - {$ref: '#/components/parameters/FiltroTipo'}
        - {name: turmaId, in: query, required: false, schema: {type: string, format: uuid}, description: Filtra por uma turma}
        - {$ref: '#/components/parameters/Ordenar'}
        - {$ref: '#/components/parameters/Direcao'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Atividade'}}}}}
  /atividades/{atividadeId}:
    put:
      tags: [Atividades]
      operationId: updateAtividade
      summary: Edita a atividade (só o professor da turma). Mesmas regras do cadastro.
      parameters: [{$ref: '#/components/parameters/AtividadeId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AtividadeInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Atividade'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    get:
      tags: [Atividades]
      operationId: getAtividade
      summary: Detalhe da atividade com estado e, para aluno, a própria entrega.
      parameters: [{$ref: '#/components/parameters/AtividadeId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AtividadeDetalhe'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /atividades/{atividadeId}/comentarios:
    get:
      tags: [Atividades]
      operationId: listComentariosAtividade
      summary: Lista os comentários de uma atividade (professor da turma ou aluno inscrito com a atividade já disponível).
      parameters: [{$ref: '#/components/parameters/AtividadeId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Comentario'}}}}}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Atividades]
      operationId: createComentarioAtividade
      summary: Comenta ou responde em uma atividade. Professor e alunos podem responder; só um nível de resposta.
      parameters: [{$ref: '#/components/parameters/AtividadeId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [texto], properties: {texto: {type: string, minLength: 1, maxLength: 3000}, comentarioPaiId: {type: string, format: uuid}}}}}}
      responses:
        '201': {description: Criado, content: {application/json: {schema: {$ref: '#/components/schemas/Comentario'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /atividades/{atividadeId}/sem-entrega:
    get:
      tags: [Entregas]
      operationId: listSemEntrega
      summary: Alunos inscritos que ainda não entregaram (só o professor da turma).
      parameters: [{$ref: '#/components/parameters/AtividadeId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AlunoResumo'}}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /atividades/{atividadeId}/entregas:
    parameters: [{$ref: '#/components/parameters/AtividadeId'}]
    post:
      tags: [Entregas]
      operationId: submitEntrega
      summary: Envio de entrega pelo aluno. Se aceitaAtraso=false e prazo final expirado, rejeita (403).
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [arquivo], properties: {arquivo: {type: string, format: binary}}}}}}
      responses:
        '201': {description: Registrada, content: {application/json: {schema: {$ref: '#/components/schemas/Entrega'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {description: Entrega já avaliada, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '413': {description: Arquivo maior que 25 MB, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '415': {description: Tipo de arquivo não aceito, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {$ref: '#/components/responses/Problem'}
    get:
      tags: [Entregas]
      operationId: listEntregas
      summary: Somente PROFESSOR dono da turma. Lista entregas enviadas.
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Entrega'}}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /entregas/{entregaId}/arquivo:
    get:
      tags: [Entregas]
      operationId: downloadEntrega
      summary: Professor dono da turma ou o próprio aluno autor da entrega. Outros alunos recebem 403.
      parameters: [{name: entregaId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Arquivo, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /entregas/{entregaId}/avaliacao:
    put:
      tags: [Entregas]
      operationId: evaluateEntrega
      summary: Somente PROFESSOR dono da turma. Nota de 0 a 10 e comentário.
      parameters: [{name: entregaId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AvaliacaoInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Entrega'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /turmas/{turmaId}/alunos:
    get:
      tags: [Grupos]
      operationId: listAlunosDaTurma
      summary: PROPOSTA (ainda sem back-end). Alunos inscritos na turma, em ordem alfabética, para montar um grupo. Professor ou aluno da turma.
      parameters: [{$ref: '#/components/parameters/TurmaId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/IntegranteDeGrupo'}}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /turmas/{turmaId}/grupos/configuracao:
    get:
      tags: [Grupos]
      operationId: getConfiguracaoDeGrupos
      summary: PROPOSTA (ainda sem back-end). Regras de formação de grupos da turma (padrão 2 a 5 integrantes, sem limite de grupos). Professor ou aluno da turma.
      parameters: [{$ref: '#/components/parameters/TurmaId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ConfiguracaoDeGrupos'}}}}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Grupos]
      operationId: putConfiguracaoDeGrupos
      summary: Somente o PROFESSOR dono da turma (RF12). Mudar as regras não desfaz grupos já aprovados.
      parameters: [{$ref: '#/components/parameters/TurmaId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfiguracaoDeGrupos'}}}}
      responses:
        '200': {description: Salva, content: {application/json: {schema: {$ref: '#/components/schemas/ConfiguracaoDeGrupos'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /turmas/{turmaId}/grupos:
    get:
      tags: [Grupos]
      operationId: listGrupos
      summary: PROPOSTA (ainda sem back-end). O professor vê todos os grupos; o aluno vê os aprovados e os próprios (qualquer estado).
      parameters: [{$ref: '#/components/parameters/TurmaId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Grupo'}}}}}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Grupos]
      operationId: solicitarGrupo
      summary: O aluno solicita um grupo (RF06). Ele entra como integrante; nasce PENDENTE. 422 se faltar ou sobrar integrante em relação à configuração, se algum aluno não for da turma ou já estiver em grupo, ou se o limite de grupos da turma já foi atingido.
      parameters: [{$ref: '#/components/parameters/TurmaId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GrupoInput'}}}}
      responses:
        '201': {description: Solicitado, content: {application/json: {schema: {$ref: '#/components/schemas/Grupo'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /grupos/{grupoId}/aprovacao:
    post:
      tags: [Grupos]
      operationId: decidirGrupo
      summary: Somente o PROFESSOR dono da turma (RF12). Só decide grupo PENDENTE (409 nos demais). Reprovado deixa de ocupar vaga dos alunos.
      parameters: [{name: grupoId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [aprovado], properties: {aprovado: {type: boolean}}}}}}
      responses:
        '200': {description: Decidido, content: {application/json: {schema: {$ref: '#/components/schemas/Grupo'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /grupos/{grupoId}/integrantes:
    post:
      tags: [Grupos]
      operationId: entrarNoGrupo
      summary: O aluno entra em grupo APROVADO da turma (RF06). 422 se o grupo está cheio ou se ele já está em outro grupo.
      parameters: [{name: grupoId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Entrou, content: {application/json: {schema: {$ref: '#/components/schemas/Grupo'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Grupos]
      operationId: sairDoGrupo
      summary: 'O próprio aluno sai (RF07). Grupo PENDENTE: sai sem restrição e, sem integrantes, o grupo é descartado. Grupo APROVADO: 422 se ficaria abaixo do mínimo da configuração.'
      parameters: [{name: grupoId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Saiu}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /notificacoes:
    get:
      tags: [Notificacoes]
      operationId: listNotificacoes
      summary: Central de notificações do usuário (sino). Gera as "atividade nova" pendentes na leitura. Até 50 itens gravados, mais os prazos próximos (48 h, atividade aberta e não entregue), que são calculados e não contam como não lidas.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Notificacoes'}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /notificacoes/{notificacaoId}/lida:
    post:
      tags: [Notificacoes]
      operationId: marcarNotificacaoLida
      summary: Marca uma notificação como lida (idempotente). Notificação de outro usuário é 404.
      parameters: [{name: notificacaoId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Marcada}
        '404': {$ref: '#/components/responses/Problem'}
  /notificacoes/lidas:
    post:
      tags: [Notificacoes]
      operationId: marcarTodasNotificacoesLidas
      summary: Marca todas as notificações do usuário como lidas.
      responses:
        '204': {description: Marcadas}
  /gamificacao/perfil:
    get:
      tags: [Gamificacao]
      operationId: getPerfilGamificacao
      summary: Perfil de gamificação do aluno autenticado (ADR-0009).
      description: Retorna nível, XP total, consistência e conquistas desbloqueadas a partir das entregas.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilGamificacao'
        '401':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: JSESSIONID, description: 'Cookie httpOnly, SameSite=Lax, Secure em produção (ADR-0004)'}
  parameters:
    TurmaId: {name: turmaId, in: path, required: true, schema: {type: string, format: uuid}}
    AtividadeId: {name: atividadeId, in: path, required: true, schema: {type: string, format: uuid}}
    FiltroEstado: {name: estado, in: query, required: false, schema: {$ref: '#/components/schemas/EstadoAtividade'}}
    FiltroTipo: {name: tipo, in: query, required: false, schema: {$ref: '#/components/schemas/AtividadeTipo'}}
    Ordenar: {name: ordenar, in: query, required: false, schema: {type: string, enum: [prazo], default: prazo}}
    Direcao: {name: direcao, in: query, required: false, schema: {type: string, enum: [asc, desc], default: asc}}
  responses:
    Problem:
      description: Erro
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Health: {type: object, required: [status, service, version, timestamp], properties: {status: {type: string}, service: {type: string}, version: {type: string}, commit: {type: string, description: SHA curto do commit da imagem no ar ("dev" fora do deploy)}, timestamp: {type: string, format: date-time}}}
    Problem: {type: object, required: [status, message], properties: {status: {type: integer}, message: {type: string}, campos: {type: array, items: {type: object, required: [campo, mensagem], properties: {campo: {type: string}, mensagem: {type: string}}}}}}
    Papel: {type: string, enum: [ALUNO, PROFESSOR]}
    Usuario: {type: object, required: [id, nome, email], properties: {id: {type: string, format: uuid}, nome: {type: string}, email: {type: string, format: email}, dataNascimento: {type: string, format: date}, papel: {$ref: '#/components/schemas/Papel'}}}
    RegisterRequest: {type: object, required: [nome, email, senha], properties: {nome: {type: string}, email: {type: string, format: email}, senha: {type: string, minLength: 8}, dataNascimento: {type: string, format: date}}}
    TurmaInput: {type: object, required: [nome, semestre], properties: {nome: {type: string}, disciplina: {type: string}, semestre: {type: string, pattern: '^[0-9]{4}\.[12]$', example: '2026.2'}, diasAula: {type: array, items: {type: integer, minimum: 1, maximum: 7}}, descricao: {type: string}}}
    Turma: {allOf: [{$ref: '#/components/schemas/TurmaInput'}, {type: object, required: [id, professorId, professorNome], properties: {id: {type: string, format: uuid}, professorId: {type: string, format: uuid}, professorNome: {type: string}, codigo: {type: string, description: Visível ao professor}, descricao: {type: string}, atividadesPendentes: {type: integer, minimum: 0}, atividadesAtrasadas: {type: integer, minimum: 0}}}]}
    AtividadeTipo: {type: string, enum: [PROVA, LISTA_DE_EXERCICIO, PROJETO_INDIVIDUAL, PROJETO_EM_GRUPO]}
    EstadoAtividade: {description: 'Derivado do prazoFinal. PENDENTE, ENTREGUE, ENTREGUE_COM_ATRASO, CONCLUIDA, ATRASADA.', type: string, enum: [PENDENTE, ENTREGUE, ENTREGUE_COM_ATRASO, CONCLUIDA, ATRASADA]}
    AtividadeInput: {type: object, required: [nome, tipo, prazoFinal], properties: {nome: {type: string}, descricao: {type: string}, tipo: {$ref: '#/components/schemas/AtividadeTipo'}, prazoFinal: {type: string, format: date-time}, disponivelEm: {type: string, format: date-time}, aceitaAtraso: {type: boolean, default: true}}}
