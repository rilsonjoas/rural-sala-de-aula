openapi: 3.0.3
info:
  title: Rural Sala de Aula API
  version: 0.1.0
  description: Contrato entre o front-end e a API. Escopo atual = requisitos P1.
servers:
  - url: http://localhost:8080/api/v1
  - url: /api/v1
security:
  - cookieAuth: []
tags: [{name: System}, {name: Auth}, {name: Turmas}, {name: Atividades}, {name: Entregas}]
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      summary: Cria a conta e já inicia a sessão (Set-Cookie), sem exigir login em seguida. O papel (ALUNO ou PROFESSOR) é escolhido livremente no P1; convite para professor é backlog.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses:
        '201': {description: Criado, content: {application/json: {schema: {$ref: '#/components/schemas/Usuario'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Usuario'}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204': {description: Sem conteúdo}
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Usuario'}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /turmas:
    get:
      tags: [Turmas]
      operationId: listTurmas
      summary: Aluno = turmas em que está inscrito; professor = turmas que administra. Sem paginação no P1.
      parameters:
        - {name: semestre, in: query, required: false, schema: {type: string, pattern: '^[0-9]{4}\.[12]$'}, description: 'Filtra por semestre, ex. 2026.2'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Turma'}}}}}
    post:
      tags: [Turmas]
      operationId: createTurma
      summary: 'Somente PROFESSOR. O código de inscrição é gerado pelo servidor (6 caracteres, sem 0, O, 1, I, L).'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TurmaInput'}}}}
      responses:
        '201': {description: Criada, content: {application/json: {schema: {$ref: '#/components/schemas/Turma'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /turmas/{turmaId}:
    get:
      tags: [Turmas]
      operationId: getTurma
      parameters: [{$ref: '#/components/parameters/TurmaId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Turma'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /inscricoes:
    post:
      tags: [Turmas]
      operationId: enrollTurma
      summary: Somente ALUNO. Código comparado sem diferenciar maiúsculas e sem espaços nas pontas.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [codigo], properties: {codigo: {type: string}}}}}}
      responses:
        '201': {description: Inscrito, content: {application/json: {schema: {$ref: '#/components/schemas/Turma'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /turmas/{turmaId}/atividades:
    parameters: [{$ref: '#/components/parameters/TurmaId'}]
    get:
      tags: [Atividades]
      operationId: listAtividades
      summary: 'Atividades de uma turma, com os filtros e a ordenação do RF05. Aluno só vê atividades já disponíveis. O filtro estado só vale para ALUNO.'
      parameters:
        - {$ref: '#/components/parameters/FiltroEstado'}
        - {$ref: '#/components/parameters/FiltroTipo'}
        - {$ref: '#/components/parameters/FiltroModalidade'}
        - {$ref: '#/components/parameters/FiltroComplexidade'}
        - {$ref: '#/components/parameters/Ordenar'}
        - {$ref: '#/components/parameters/Direcao'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Atividade'}}}}}
    post:
      tags: [Atividades]
      operationId: createAtividade
      summary: Somente PROFESSOR dono da turma.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AtividadeInput'}}}}
      responses:
        '201': {description: Criada, content: {application/json: {schema: {$ref: '#/components/schemas/Atividade'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /atividades:
    get:
      tags: [Atividades]
      operationId: listMinhasAtividades
      summary: 'Somente ALUNO. Atividades de todas as turmas em que está inscrito, com os filtros e a ordenação do RF05 (estado, tipo, modalidade, complexidade, turma). Só atividades já disponíveis. ordenar=prazo ordena por prazoFinal. Sem paginação no P1.'
      parameters:
        - {$ref: '#/components/parameters/FiltroEstado'}
        - {$ref: '#/components/parameters/FiltroTipo'}
        - {$ref: '#/components/parameters/FiltroModalidade'}
        - {$ref: '#/components/parameters/FiltroComplexidade'}
        - {name: turmaId, in: query, required: false, schema: {type: string, format: uuid}, description: Filtra por uma turma}
        - {$ref: '#/components/parameters/Ordenar'}
        - {$ref: '#/components/parameters/Direcao'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Atividade'}}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /atividades/{atividadeId}:
    get:
      tags: [Atividades]
      operationId: getAtividade
      summary: Detalhe da atividade com estado e, para ALUNO, a própria entrega (minhaEntrega).
      parameters: [{$ref: '#/components/parameters/AtividadeId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AtividadeDetalhe'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /atividades/{atividadeId}/entregas:
    parameters: [{$ref: '#/components/parameters/AtividadeId'}]
    post:
      tags: [Entregas]
      operationId: submitEntrega
      summary: 'Somente ALUNO inscrito. Reenvio substitui a entrega anterior. Após o prazo_final é aceita e marcada como atrasada. Limites: até 25 MB; extensões pdf, ppt, pptx, doc, docx, txt. Depois que o professor avalia a entrega, o reenvio é bloqueado (409).'
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [arquivo], properties: {arquivo: {type: string, format: binary}}}}}}
      responses:
        '201': {description: Registrada, content: {application/json: {schema: {$ref: '#/components/schemas/Entrega'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {description: Entrega já avaliada; não aceita reenvio, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '413': {description: Arquivo maior que 25 MB, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '415': {description: Tipo de arquivo não aceito, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {$ref: '#/components/responses/Problem'}
    get:
      tags: [Entregas]
      operationId: listEntregas
      summary: Somente PROFESSOR dono da turma. Lista só quem entregou (quem não entregou é backlog).
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Entrega'}}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /entregas/{entregaId}/arquivo:
    get:
      tags: [Entregas]
      operationId: downloadEntrega
      summary: Somente PROFESSOR dono da turma.
      parameters: [{name: entregaId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Arquivo, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /entregas/{entregaId}/avaliacao:
    put:
      tags: [Entregas]
      operationId: evaluateEntrega
      summary: Somente PROFESSOR dono da turma. Nota de 0 a 10.
      parameters: [{name: entregaId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AvaliacaoInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Entrega'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: SESSION, description: 'Cookie httpOnly, SameSite=Lax, definido por login e register (ADR-0004). O front nunca lê o token; usa GET /me para saber quem está logado.'}
  parameters:
    TurmaId: {name: turmaId, in: path, required: true, schema: {type: string, format: uuid}}
    AtividadeId: {name: atividadeId, in: path, required: true, schema: {type: string, format: uuid}}
    FiltroEstado: {name: estado, in: query, required: false, schema: {$ref: '#/components/schemas/EstadoAtividade'}}
    FiltroTipo: {name: tipo, in: query, required: false, schema: {$ref: '#/components/schemas/AtividadeTipo'}}
    FiltroModalidade: {name: modalidade, in: query, required: false, schema: {$ref: '#/components/schemas/AtividadeModalidade'}}
    FiltroComplexidade: {name: complexidade, in: query, required: false, schema: {$ref: '#/components/schemas/Complexidade'}}
    Ordenar: {name: ordenar, in: query, required: false, schema: {type: string, enum: [prazo, complexidade], default: prazo}, description: 'prazo = prazoFinal; complexidade ordena BAIXA < MEDIA < ALTA'}
    Direcao: {name: direcao, in: query, required: false, schema: {type: string, enum: [asc, desc], default: asc}}
  responses:
    Problem:
      description: Erro
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Health: {type: object, required: [status, service, version, timestamp], properties: {status: {type: string}, service: {type: string}, version: {type: string}, timestamp: {type: string, format: date-time}}}
    Problem: {type: object, required: [status, message], properties: {status: {type: integer}, message: {type: string}, campos: {type: array, description: 'Erros por campo (422), para o front marcar o campo certo', items: {type: object, required: [campo, mensagem], properties: {campo: {type: string, example: prazoFinal}, mensagem: {type: string}}}}}}
    Papel: {type: string, enum: [ALUNO, PROFESSOR]}
    Usuario: {type: object, required: [id, nome, email, papel], properties: {id: {type: string, format: uuid}, nome: {type: string}, email: {type: string, format: email}, papel: {$ref: '#/components/schemas/Papel'}}}
    RegisterRequest: {type: object, required: [nome, email, senha, papel], properties: {nome: {type: string}, email: {type: string, format: email}, senha: {type: string, minLength: 8}, papel: {$ref: '#/components/schemas/Papel'}}}
    LoginRequest: {type: object, required: [email, senha], properties: {email: {type: string, format: email}, senha: {type: string}}}
    TurmaInput: {type: object, required: [nome, disciplina, semestre, diasAula], properties: {nome: {type: string}, disciplina: {type: string}, semestre: {type: string, pattern: '^[0-9]{4}\.[12]$', example: '2026.2'}, diasAula: {type: array, minItems: 1, items: {type: integer, minimum: 1, maximum: 7}}}}
    Turma: {allOf: [{$ref: '#/components/schemas/TurmaInput'}, {type: object, required: [id, professorId, professorNome], properties: {id: {type: string, format: uuid}, professorId: {type: string, format: uuid}, professorNome: {type: string}, codigo: {type: string, description: Visível apenas ao professor dono}, atividadesPendentes: {type: integer, minimum: 0, description: 'Só para ALUNO: atividades disponíveis com estado PENDENTE'}, atividadesAtrasadas: {type: integer, minimum: 0, description: 'Só para ALUNO: atividades disponíveis com estado ATRASADA'}}}]}
    AtividadeTipo: {type: string, enum: [ATIVIDADE, TRABALHO, PROVA]}
    AtividadeModalidade: {type: string, enum: [INDIVIDUAL, GRUPO]}
    Complexidade: {type: string, enum: [BAIXA, MEDIA, ALTA]}
    EstadoAtividade: {description: 'Derivado do prazoFinal, o limite real definido pelo professor. A data de entrega é a do próprio aluno (Entrega.enviadaEm). PENDENTE = sem entrega e agora ≤ prazoFinal. ATRASADA = sem entrega e agora > prazoFinal. ENTREGUE_COM_ATRASO = enviadaEm > prazoFinal. CONCLUIDA = entrega avaliada.', type: string, enum: [PENDENTE, ENTREGUE, ENTREGUE_COM_ATRASO, CONCLUIDA, ATRASADA]}
    AtividadeInput: {type: object, required: [nome, complexidade, tipo, prazoFinal], properties: {nome: {type: string}, descricao: {type: string}, complexidade: {$ref: '#/components/schemas/Complexidade'}, tipo: {$ref: '#/components/schemas/AtividadeTipo'}, modalidade: {$ref: '#/components/schemas/AtividadeModalidade'}, prazoFinal: {type: string, format: date-time, description: Limite real; depois dele a entrega conta como atrasada}, disponivelEm: {type: string, format: date-time}}}
    Atividade: {allOf: [{$ref: '#/components/schemas/AtividadeInput'}, {type: object, required: [id, turmaId, turmaNome, modalidade, disponivelEm], properties: {id: {type: string, format: uuid}, turmaId: {type: string, format: uuid}, turmaNome: {type: string}, modalidade: {$ref: '#/components/schemas/AtividadeModalidade'}, disponivelEm: {type: string, format: date-time}, estado: {allOf: [{$ref: '#/components/schemas/EstadoAtividade'}], description: Derivado; só para ALUNO}, nota: {type: number, nullable: true, minimum: 0, maximum: 10, description: 'Só para ALUNO: nota da entrega, quando já avaliada (para o selo Concluída · nota 9,5)'}}}]}
    AtividadeDetalhe: {allOf: [{$ref: '#/components/schemas/Atividade'}, {type: object, required: [professorNome], properties: {professorNome: {type: string}, minhaEntrega: {allOf: [{$ref: '#/components/schemas/Entrega'}], nullable: true, description: 'Entrega do próprio aluno, se houver (inclui nota e comentarioPrivado quando avaliada)'}}}]}
    AvaliacaoInput: {type: object, required: [nota], properties: {nota: {type: number, minimum: 0, maximum: 10, multipleOf: 0.1, description: Até 1 casa decimal}, comentarioPrivado: {type: string}}}
    Entrega: {type: object, required: [id, atividadeId, alunoId, alunoNome, nomeOriginal, tamanhoBytes, enviadaEm, atrasada], properties: {id: {type: string, format: uuid}, atividadeId: {type: string, format: uuid}, alunoId: {type: string, format: uuid}, alunoNome: {type: string}, nomeOriginal: {type: string}, tamanhoBytes: {type: integer, minimum: 0}, enviadaEm: {type: string, format: date-time}, atrasada: {type: boolean, description: enviadaEm > prazoFinal da atividade}, nota: {type: number, nullable: true, minimum: 0, maximum: 10}, comentarioPrivado: {type: string, nullable: true}}}
