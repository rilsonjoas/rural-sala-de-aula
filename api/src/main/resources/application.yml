server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  application:
    name: rural-sala-de-aula-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rural_sala_de_aula}
    username: ${DATABASE_USERNAME:sala}
    password: ${DATABASE_PASSWORD:sala}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${OPENAPI_ENABLED:false}

app:
  cors:
    allowed-origins: ${FRONT_ORIGINS:http://localhost:5173}
