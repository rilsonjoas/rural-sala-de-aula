spring.application.name=rural-sala-de-aula

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rural_sala_de_aula}
spring.datasource.username=${DATABASE_USERNAME:sala}
spring.datasource.password=${DATABASE_PASSWORD:sala}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

server.port=${PORT:8080}
server.forward-headers-strategy=framework
# Desligamento gracioso: termina as requisicoes em andamento (ex.: um envio) antes de parar.
# O stop_grace_period do compose (30s) precisa ser maior que o timeout abaixo.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Sessao no Postgres (sobrevive a deploy); as tabelas vem do Flyway V2
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 */15 * * * *
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Commit da imagem (Dockerfile: GIT_COMMIT), mostrado em /api/v1/health
app.commit=${APP_COMMIT:dev}

# Dados de exemplo (usuarios com senha conhecida): so ligar em desenvolvimento
app.seed.enabled=${APP_SEED_ENABLED:false}
management.endpoints.web.exposure.include=health,info
