      type: string
      enum:
        - BAIXA
        - MEDIA
        - ALTA
    TarefaStatus:
      type: string
      enum:
        - PENDENTE
        - CONCLUIDA
    ProvaRequest:
      type: object
      required:
        - title
        - startsAt
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        startsAt:
          type: string
          format: date-time
        weight:
          type: number
          minimum: 0
          maximum: 100
        grade:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        notes:
          type: string
          maxLength: 4000
          nullable: true
    Prova:
      allOf:
        - $ref: '#/components/schemas/ProvaRequest'
        - type: object
          required:
            - id
            - disciplinaId
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            disciplinaId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    HorarioRequest:
